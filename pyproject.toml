[project]
name = "ai-tech-radar"
version = "0.1.0"
description = "AI technology intelligence radar: collect, analyze, and report."
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0.11",
    "httpx>=0.27.0",
    "loguru>=0.7.2",
    "PyYAML>=6.0.1",
    "requests>=2.32.0",
]

[project.scripts]
ai-tech-radar = "ai_tech_radar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
